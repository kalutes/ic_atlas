services:
  ic-atlas:
    image: ${IC_ATLAS_IMAGE:-ic-atlas:0.1.0}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      ASSETS_DIR: /assets
      DOWNLOAD_ASSETS: ${DOWNLOAD_ASSETS:-1}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      TZ: Asia/Tokyo
    volumes:
      - ${IC_ATLAS_DATA_DIR:-./data}:/data
      - ${IC_ATLAS_ASSETS_DIR:-./assets}:/assets
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
